[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pine2ast"
version = "5.0.0rc6"
description = "Version-exact Pine Script v1-v6 static frontend for OpenPine: parser, AST, binding, types, qualifiers, overloads, semantic facts, and immutable consumer contracts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Interpipe Solutions"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/s7cret/pine2ast"
Repository = "https://github.com/s7cret/pine2ast"
Issues = "https://github.com/s7cret/pine2ast/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "black>=24", "mypy>=1.10", "jsonschema>=4"]
[project.scripts]
pine2ast = "pine2ast.cli:main"
pine2ast-stage4 = "pine2ast.hardening.cli:main"
pine2ast-stage5 = "pine2ast.hardening.stage5_cli:main"
[tool.setuptools.packages.find]
include = ["pine2ast*"]
[tool.setuptools.package-data]
pine2ast = ["hardening/*.json", "py.typed", "semantic/*.json", "catalog/**/*.json", "reference_catalog/*.json", "hardening/data/*.json", "hardening/data/corpus/*.pine", "hardening/data/historical_corpus/*.pine", "hardening/schemas/*.json", "catalog_data/packs/*.json"]
[tool.black]
line-length = 100
target-version = ["py311"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]
python_files = ["test_*.py"]
markers = ["performance: release and performance gates run without coverage instrumentation"]
[tool.coverage.run]
branch = true
source = ["pine2ast"]
[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
[tool.mypy]
python_version = "3.11"
packages = ["pine2ast"]
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "pine2ast.api",
    "pine2ast.libraries.linker",
    "pine2ast.libraries.method_projection",
    "pine2ast.libraries.qualifier_context",
    "pine2ast.libraries.version_compatibility",
    "pine2ast.semantic.analyzer",
    "pine2ast.semantic.analyzer_statements",
    "pine2ast.semantic.call_graph",
    "pine2ast.semantic.callable_context",
    "pine2ast.semantic.function_candidates",
    "pine2ast.semantic.method_candidates",
    "pine2ast.semantic.mutation_identity",
    "pine2ast.semantic.passes.declaration_index",
    "pine2ast.semantic.signatures",
]
# Continuation overlay is not yet mypy-clean; producer-gates still typecheck the rest.
ignore_errors = true

