name: Verify generic collection facts and typed nz before RC6 publication
'on':
  push:
    branches: ['ops/stage2-intrabar-20260907']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore the exact reviewed source commit
        run: |
          cp .github/intrabar/delivery.py "$RUNNER_TEMP/delivery.py"
          python "$RUNNER_TEMP/delivery.py" restore .github/intrabar "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/delivery.py" "$RUNNER_TEMP/evidence/delivery.py"
      - name: Full parser suite and real distribution builds
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 build==1.6.0 pytest==9.1.1 ruff==0.16.6
          mkdir -p "$RUNNER_TEMP/install-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/install-source"
          python -m pip install "$RUNNER_TEMP/install-source[dev]"
          python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/tests.xml"
          python - <<'PY'
          import os,xml.etree.ElementTree as E
          cases=list(E.parse(os.environ['RUNNER_TEMP']+'/evidence/tests.xml').iter('testcase'))
          assert len(cases)==597
          assert not any(c.find(k) is not None for c in cases for k in ('failure','error','skipped'))
          PY
          python -m ruff check pine2ast/semantic/binder.py pine2ast/semantic/type_helpers.py pine2ast/semantic/type_infer.py pine2ast/semantic/signatures.py tools/catalog/build_catalog.py tests/test_generic_collection_fact_identity.py tests/coverage/test_type_model_and_version_coverage.py
          python -m compileall -q pine2ast
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/install-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intrabar-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: intrabar-3.13-${{ github.run_id }}
          path: evidence
      - run: python evidence/delivery.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intrabar-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
