name: Verify original positional exit binding before publication
'on':
  push:
    branches: ['ops/rc6-metadata-transfer-20260906']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore original commit from reviewed patch
        run: |
          cp .github/metadata-transfer/restore.py "$RUNNER_TEMP/restore.py"
          python "$RUNNER_TEMP/restore.py" restore "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/evidence/restore.py"
      - name: Install clean source copy and test dependencies
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 build==1.6.0
          mkdir "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m pip install "$RUNNER_TEMP/build-source[dev]"
      - name: Full frontend suite including release and performance cases
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/pine2ast.xml"
      - name: Lint and distribution builds
        run: |
          python -m ruff check pine2ast/semantic/static_validation.py tests/stage5/test_exit_argument_binding.py
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-transfer-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: metadata-transfer-3.13-${{ github.run_id }}
          path: evidence
      - run: python evidence/restore.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-transfer-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
