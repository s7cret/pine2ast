name: Stage 4 hardening
on:
  pull_request:
  push:
    branches: [main, "release/**"]
permissions:
  contents: read
jobs:
  producer-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check pine2ast tests tools
      - run: python -m black --check pine2ast tests tools
      - run: python -m mypy pine2ast
      - run: python tools/catalog/build_catalog.py --check
      - run: python tools/stage4_gate.py --fuzz-cases 2000 --performance-repeats 3 --json stage4-gate.json
      - run: python -m pytest --cov=pine2ast --cov-report=term-missing -m "not performance"
      - run: python -m pytest -m performance
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "stage4-${{ matrix.python }}", path: stage4-gate.json}
  coordinated-boundary:
    runs-on: ubuntu-latest
    needs: producer-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -e ".[dev]"
      - name: Confirm boundary remains fail-closed until exact Ast2Python RC6 acceptance
        run: |
          set +e
          python tools/stage4_gate.py --coordinated --fuzz-cases 100 --performance-repeats 1 --json coordinated.json
          code=$?
          test "$code" -ne 0
          python - <<'PY'
          import json
          p=json.load(open('coordinated.json'))
          assert p['producer_status']=='PASS'
          assert p['coordinated_status']=='PENDING_COORDINATED_CONSUMER'
          assert p['release_authorized'] is False
          PY
