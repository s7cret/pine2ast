name: Verify versioned request types and NA catalog before publication
'on':
  push:
    branches: ['ops/rc6-requests-20260906']
permissions:
  contents: read
concurrency:
  group: rc6-request-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools==84.0.0 wheel==0.48.0 build==1.6.0
      - name: Rebuild catalog and restore exact reviewed commits
        run: |
          cp .github/requests/restore.py "$RUNNER_TEMP/restore.py"
          python "$RUNNER_TEMP/restore.py" restore .github/requests/plan.json "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/evidence/restore.py"
      - name: Install clean source copy
        run: |
          mkdir -p "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m pip install "$RUNNER_TEMP/build-source[dev]"
      - name: Complete frontend functional suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/pine2ast.xml"
      - name: Changed source lint and distribution builds
        run: |
          python -m ruff check pine2ast/semantic/type_infer.py pine2ast/semantic/signatures.py pine2ast/semantic/analyzer_expressions.py tools/catalog/build_catalog.py tests/stage5/test_request_na_evidence.py tests/stage5/test_request_return_evidence.py
          python -m compileall -q pine2ast
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requests-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: requests-3.13-${{ github.run_id }}
          path: evidence
      - name: Create canonical RC6 only after verification and preserve maintenance history
        run: python evidence/restore.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requests-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
